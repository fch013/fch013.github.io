<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
  <title id="title">Light-field microscopy and computational reconstruction</title>
  <desc id="desc">A three-dimensional sample is imaged through a microlens array to form a raw light-field measurement, which is converted into a three-dimensional reconstruction.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <linearGradient id="volume" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.38"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="718" height="238" rx="16" fill="#ffffff" stroke="#dbe4ef"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" fill="#334155" text-anchor="middle">
    <text x="88" y="210">3D sample</text>
    <text x="260" y="210">Microlens array</text>
    <text x="442" y="210">Raw light field</text>
    <text x="625" y="210">3D reconstruction</text>
  </g>

  <g transform="translate(38 48)">
    <ellipse cx="50" cy="78" rx="45" ry="19" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
    <ellipse cx="50" cy="56" rx="36" ry="16" fill="#67e8f9" fill-opacity="0.75" stroke="#0891b2" stroke-width="2"/>
    <ellipse cx="50" cy="34" rx="27" ry="13" fill="#c4b5fd" fill-opacity="0.8" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="35" cy="56" r="5" fill="#f97316"/>
    <circle cx="63" cy="34" r="5" fill="#2563eb"/>
    <circle cx="67" cy="80" r="5" fill="#7c3aed"/>
  </g>

  <line x1="142" y1="115" x2="190" y2="115" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(209 61)" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5">
    <circle cx="16" cy="16" r="13"/><circle cx="50" cy="16" r="13"/><circle cx="84" cy="16" r="13"/>
    <circle cx="16" cy="50" r="13"/><circle cx="50" cy="50" r="13"/><circle cx="84" cy="50" r="13"/>
    <circle cx="16" cy="84" r="13"/><circle cx="50" cy="84" r="13"/><circle cx="84" cy="84" r="13"/>
  </g>

  <line x1="312" y1="115" x2="360" y2="115" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(380 58)">
    <rect width="124" height="114" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <g fill="#2563eb" fill-opacity="0.78">
      <circle cx="20" cy="20" r="5"/><circle cx="49" cy="17" r="4"/><circle cx="82" cy="22" r="6"/><circle cx="108" cy="18" r="4"/>
      <circle cx="17" cy="52" r="4"/><circle cx="49" cy="51" r="7"/><circle cx="79" cy="48" r="4"/><circle cx="106" cy="55" r="6"/>
      <circle cx="22" cy="88" r="6"/><circle cx="53" cy="84" r="4"/><circle cx="82" cy="91" r="7"/><circle cx="108" cy="86" r="4"/>
    </g>
    <path d="M31 0v114M62 0v114M93 0v114M0 38h124M0 76h124" stroke="#bfdbfe" stroke-width="1"/>
  </g>

  <line x1="512" y1="115" x2="550" y2="115" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(570 48)">
    <path d="M10 24 L82 8 L114 28 L42 45 Z" fill="url(#volume)" stroke="#2563eb" stroke-width="1.8"/>
    <path d="M10 53 L82 37 L114 57 L42 74 Z" fill="url(#volume)" stroke="#2563eb" stroke-width="1.8"/>
    <path d="M10 82 L82 66 L114 86 L42 103 Z" fill="url(#volume)" stroke="#2563eb" stroke-width="1.8"/>
    <circle cx="76" cy="43" r="6" fill="#f97316"/><circle cx="51" cy="77" r="6" fill="#7c3aed"/><circle cx="88" cy="82" r="5" fill="#0f766e"/>
  </g>
</svg>
