# Site identity
locale: "en-US"
site_theme: "default"
title: "Feng-Chun Hsu"
title_separator: "—"
name: &name "Feng-Chun Hsu"
description: &description "Optical and computational imaging researcher working across microscopy, physical modeling, and physics-informed learning."
url: "https://fch013.github.io"
baseurl: ""
repository: "fch013/fch013.github.io"
timezone: "Asia/Taipei"

# Sidebar profile
author:
  avatar: "profile-outdoors-small.png"
  avatar_crop: true
  name: *name
  bio: "postdoctoral research associate at APL NYCU"
  location: "Tainan, Taiwan"
  employer:
  uri:
  email: "tk821017@gmail.com"
  googlescholar: "https://scholar.google.com/citations?user=3wY6nq8AAAAJ"
  github: 
  linkedin: "feng-chun-hsu-57955b313"
  cv: "/files/CV_FengChun_Hsu.pdf"

# Site behavior
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
comments:
  provider: false
atom_feed:
  hide: true

# Search and social previews
og_image: "social-preview.png"
og_description: *description
social:
  type: Person
  name: *name
  links:
    - "https://scholar.google.com/citations?user=3wY6nq8AAAAJ"
    - "https://github.com/fch013"
    - "https://www.linkedin.com/in/feng-chun-hsu-57955b313/"

analytics:
  provider: false

# Files and Markdown
include:
  - .htaccess
  - _pages
  - files
exclude:
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - CONTRIBUTING.md
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - config
  - docker-compose.yaml
  - markdown_generator
  - node_modules
  - package.json
  - package-lock.json
  - talkmap.ipynb
  - talkmap.py
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Default page layout
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
